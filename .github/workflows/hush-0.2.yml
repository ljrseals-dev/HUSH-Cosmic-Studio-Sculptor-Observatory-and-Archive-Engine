name: HUSH 0.2 headless contracts
on:
  push:
    branches: [codex/hush-0.2-headless-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  linux-cxx20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure offline build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHUSH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Contract tests
        run: ctest --test-dir build --output-on-failure
