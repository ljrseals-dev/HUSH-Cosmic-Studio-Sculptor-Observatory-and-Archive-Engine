name: HUSH 0.2 headless contracts
on:
  push:
    branches: [main, codex/hush-0.2-headless-foundation, milestone/0.3b-release-gate-harnesses]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  repo-artifact-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed build outputs and new binary archives
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"
          forbidden="$(printf '%s\n' "$tracked" | grep -E '(^|/)(build|build-[^/]*)(/|$)|(^|/)\.DS_Store$|\.zip$' | grep -v -E '^(Source/HUSH-Cosmic-Studio-0\.2\.1-GitHub-Source\.zip|hush-daw-codex-hush-processor-integration-starter \(1\)\.zip)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden tracked build artifact(s) or unapproved archive(s):"
            printf '%s\n' "$forbidden"
            exit 1
          fi
          # Temporary allowlist is only for two pre-existing, unverified archives documented
          # in Docs/REPO_AUDIT.md. New or modified ZIPs must fail until those archives are resolved.
          if [[ -n "${BASE_SHA:-}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            changed="$(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- '*.zip' || true)"
            if [[ -n "$changed" ]]; then
              echo "Do not add or modify committed ZIP archives; publish binaries as release assets:"
              printf '%s\n' "$changed"
              exit 1
            fi
          fi

  linux-cxx20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure offline build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHUSH_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Contract tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke-test benchmark and recovery soak harnesses
        shell: bash
        run: |
          set -euo pipefail
          ./build/hush_routing_benchmark 500 1 | tee /tmp/hush-routing-benchmark.json
          ./build/hush_headless_soak 1 /tmp/hush-soak-smoke.journal | tee /tmp/hush-headless-soak.json
          python3 -c 'import json; [json.load(open(p)) for p in ("/tmp/hush-routing-benchmark.json", "/tmp/hush-headless-soak.json")]'
          rm -f /tmp/hush-soak-smoke.journal
      - name: Run 500-track software performance gate and capture report
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          set +e
          ./build/hush_routing_benchmark 500 10 2666.667 > artifacts/hush-routing-500-ci.json
          benchmark_exit=$?
          set -e
          python3 - "$GITHUB_SHA" "$benchmark_exit" <<'PY'
          import datetime, json, os, platform, subprocess, sys
          path = "artifacts/hush-routing-500-ci.json"
          try:
              with open(path, encoding="utf-8") as stream:
                  report = json.load(stream)
          except (OSError, json.JSONDecodeError):
              report = {"status": "not_run", "reason": "benchmark did not emit valid JSON"}
          cpu = platform.processor() or "unknown"
          try:
              with open("/proc/cpuinfo", encoding="utf-8") as stream:
                  for line in stream:
                      if line.lower().startswith("model name"):
                          cpu = line.split(":", 1)[1].strip()
                          break
          except OSError:
              pass
          report.update({
              "report_kind": "github_actions_synthetic_software_benchmark",
              "tested_commit_sha": sys.argv[1],
              "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "os": platform.platform(),
              "kernel": platform.release(),
              "cpu": cpu,
              "command": "./build/hush_routing_benchmark 500 10 2666.667",
              "benchmark_exit_code": int(sys.argv[2]),
              "qualification_note": "CI runner timing is software-only evidence; not a target-machine, ALSA, latency-loopback, or zero-xrun qualification.",
              "hardware_audio_test": False,
          })
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(report, stream, indent=2, sort_keys=True)
              stream.write("\\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          exit "$benchmark_exit"
      - name: Upload 500-track performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hush-500-track-performance-${{ github.run_id }}
          path: artifacts/hush-routing-500-ci.json
          if-no-files-found: ignore

  linux-alsa-enabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA development headers
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev
      - name: Configure ALSA-enabled build
        run: cmake -S . -B build-alsa -DCMAKE_BUILD_TYPE=Release -DHUSH_BUILD_TESTS=ON -DHUSH_ENABLE_ALSA=ON
      - name: Build ALSA backend and realtime host
        run: cmake --build build-alsa --parallel 2
      - name: Contract tests
        run: ctest --test-dir build-alsa --output-on-failure

  linux-qt6-mixer-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 Widgets
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-base-dev
      - name: Configure GUI build
        run: cmake -S . -B build-gui -DCMAKE_BUILD_TYPE=Release -DHUSH_BUILD_TESTS=ON -DHUSH_BUILD_GUI=ON
      - name: Build GUI and contracts
        run: cmake --build build-gui --parallel 2
      - name: Contract tests
        run: ctest --test-dir build-gui --output-on-failure

  linux-qt6-alsa-live-mixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and ALSA development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qt6-base-dev libasound2-dev
      - name: Configure combined live mixer GUI build
        run: cmake -S . -B build-gui-alsa -DCMAKE_BUILD_TYPE=Release -DHUSH_BUILD_TESTS=ON -DHUSH_BUILD_GUI=ON -DHUSH_ENABLE_ALSA=ON
      - name: Build GUI and ALSA live monitor
        run: cmake --build build-gui-alsa --parallel 2
      - name: Contract tests
        run: ctest --test-dir build-gui-alsa --output-on-failure

  linux-asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AddressSanitizer build
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DHUSH_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Contract tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  linux-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ThreadSanitizer build
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DHUSH_BUILD_TESTS=ON -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        run: cmake --build build-tsan --parallel 2
      - name: Contract tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure
